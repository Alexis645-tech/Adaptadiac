name: Actualización Automática del Currículo Nacional (DCDs)

on:
  schedule:
    # Se ejecuta el día 1 de cada mes a las 03:00 UTC (100% gratuito)
    - cron: '0 3 1 * *'
  workflow_dispatch:
    # Permite ejecutarlo manualmente en cualquier momento desde GitHub

permissions:
  contents: write

jobs:
  update-curriculum:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Ejecutar Robot Determinista de Extracción (Regex + Tablas PDF)
        run: |
          python scripts/update_curriculum.py


      - name: Verificar cambios y auto-actualizar repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No hay nuevas DCDs para commitear."
          else
            git commit -m "chore(curriculum): sincronización mensual de DCDs curriculares [skip ci]"
            git push origin main
          fi
